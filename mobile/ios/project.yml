name: SuzanoAberta

options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: br.com.suzanoaberta
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

targets:
  SuzanoAberta:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SuzanoAberta
      - path: ../../web/app
        name: www
        type: folder
        buildPhase: resources
    info:
      path: SuzanoAberta/Info.plist
      properties:
        CFBundleDisplayName: Suzano Aberta
        CFBundleLocalizations:
          - pt_BR
        LSApplicationCategoryType: public.app-category.reference
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.suzanoaberta.app
        PRODUCT_NAME: SuzanoAberta
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      gatherCoverageData: false
