name: One-shot branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: startsWith(github.event.head_commit.message, 'chore: run one-shot branch cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete obsolete merged branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "hardening/source-integrity"
            "maintenance/ci-supply-chain"
            "maintenance/dependabot-config"
            "maintenance/dependency-refresh"
            "maintenance/security-baseline"
            "maintenance/one-shot-branch-cleanup"
            "release/v0.1.0-candidate"
            "release/v0.1.0-delivery"
            "release/v0.1.0-final"
            "release/v0.1.0-final2"
            "release/v0.1.0-final-final"
            "release/v0.1.0-final-rc"
            "release/v0.1.0-hardening"
            "release/v0.1.0-rc1"
            "release/v0.1.0-ready"
            "release/v0.1.0-ship"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          echo "Preserved: main, release/v0.1.0, release/v0.1.0-candidate2"
