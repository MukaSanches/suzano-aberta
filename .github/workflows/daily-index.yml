name: Daily autonomous index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-index.yml"
      - "scripts/bootstrap_documents.py"
      - "scripts/bootstrap_legislation.py"
      - "src/suzano_aberta/catalog.py"
      - "src/suzano_aberta/sources/**"
  schedule:
    - cron: "17 07 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-autonomous-index
  cancel-in-progress: true

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install library
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Restore previous rolling snapshot
        shell: bash
        run: |
          set -u
          rm -f suzano-aberta.sqlite3 suzano-aberta.sqlite3.gz
          if gh release view data-latest >/dev/null 2>&1; then
            if gh release download data-latest --pattern "suzano-aberta.sqlite3.gz" --clobber; then
              if gzip -t suzano-aberta.sqlite3.gz; then
                gzip -dc suzano-aberta.sqlite3.gz > suzano-aberta.sqlite3
              fi
            fi
          fi
          rm -f suzano-aberta.sqlite3.gz

      - name: Bootstrap official documents first
        run: |
          python scripts/bootstrap_documents.py \
            --database suzano-aberta.sqlite3 \
            --max-pages 30 \
            --max-documents 150

      - name: Bootstrap official municipal legislation
        run: |
          python scripts/bootstrap_legislation.py \
            --database suzano-aberta.sqlite3 \
            --from-year 1949 \
            --to-year "$(date -u +%Y)"

      - name: Refresh structured official sources before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_YEAR="$(date -u +%Y)"
          YEARS="$((CURRENT_YEAR - 2)),$((CURRENT_YEAR - 1)),${CURRENT_YEAR}"
          suzano atualizar \
            --anos "${YEARS}" \
            --sem-descoberta \
            --sem-noticias-web \
            --max-paginas 0 \
            --profundidade 0 \
            --max-arquivos 0

      - name: Publish structured safe checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from datetime import UTC, datetime

          db = sqlite3.connect("suzano-aberta.sqlite3")
          db.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
          check = db.execute("PRAGMA quick_check").fetchone()[0]
          counts = dict(db.execute(
              "SELECT kind, COUNT(*) FROM records WHERE active=1 GROUP BY kind ORDER BY kind"
          ).fetchall())
          total = sum(int(value) for value in counts.values())
          document_kinds = {
              "arquivo", "arquivo_historico", "diario",
              "documento_fiscal", "documento_orcamentario", "lei", "decreto",
          }
          legislation_kinds = {"lei", "decreto", "proposicao"}
          procurement_kinds = {"licitacao", "contrato", "ata"}
          documents = sum(int(counts.get(kind, 0)) for kind in document_kinds)
          legislation = sum(int(counts.get(kind, 0)) for kind in legislation_kinds)
          procurements = sum(int(counts.get(kind, 0)) for kind in procurement_kinds)
          procurement_api_records = db.execute(
              "SELECT COUNT(*) FROM records WHERE active=1 "
              "AND (id LIKE 'pncp:%' OR id LIKE 'comprasgov:%')"
          ).fetchone()[0]
          extracted = db.execute(
              "SELECT COUNT(*) FROM records WHERE active=1 AND kind='arquivo' "
              "AND payload_json LIKE '%\"texto_extraido\":true%'"
          ).fetchone()[0]
          fts = db.execute("SELECT COUNT(*) FROM records_fts").fetchone()[0]
          db.close()
          if (
              str(check).lower() != "ok"
              or total < 1
              or documents < 1
              or legislation < 1
              or procurements < 1
              or procurement_api_records < 1
              or fts != total
          ):
              raise SystemExit(
                  "checkpoint inválido: "
                  f"check={check} records={total} documents={documents} "
                  f"legislation={legislation} procurements={procurements} "
                  f"procurement_api_records={procurement_api_records} fts={fts}"
              )
          metadata = {
              "generated_at": datetime.now(UTC).isoformat(),
              "records": total,
              "documents": documents,
              "legislation": legislation,
              "procurements": procurements,
              "procurement_api_records": procurement_api_records,
              "documents_with_extracted_text": extracted,
              "fts_rows": fts,
              "counts_by_kind": counts,
              "schema": 5,
              "profile": "structured-checkpoint",
          }
          with open("data-latest.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, ensure_ascii=False, indent=2)
          print(json.dumps(metadata, ensure_ascii=False))
          PY
          gzip -9 -n -c suzano-aberta.sqlite3 > suzano-aberta.sqlite3.gz
          sha256sum suzano-aberta.sqlite3.gz > suzano-aberta.sqlite3.gz.sha256
          gh release upload data-latest \
            suzano-aberta.sqlite3.gz \
            suzano-aberta.sqlite3.gz.sha256 \
            data-latest.json \
            --clobber
          gh workflow run pages.yml --ref main
          rm -f suzano-aberta.sqlite3.gz suzano-aberta.sqlite3.gz.sha256 data-latest.json

      - name: Refresh official sources, web discovery and news mentions
        run: suzano atualizar --max-paginas 1200 --profundidade 3 --max-arquivos 650

      - name: Validate and describe SQLite index
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from datetime import UTC, datetime

          db = sqlite3.connect("suzano-aberta.sqlite3")
          db.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
          check = db.execute("PRAGMA quick_check").fetchone()[0]
          if str(check).lower() != "ok":
              raise SystemExit(f"quick_check failed: {check}")

          total = db.execute("SELECT COUNT(*) FROM records WHERE active=1").fetchone()[0]
          if total < 1:
              raise SystemExit("refusing to publish an empty index")

          counts = dict(db.execute(
              "SELECT kind, COUNT(*) FROM records WHERE active=1 GROUP BY kind ORDER BY kind"
          ).fetchall())
          document_kinds = {
              "arquivo",
              "arquivo_historico",
              "diario",
              "documento_fiscal",
              "documento_orcamentario",
              "lei",
              "decreto",
          }
          legislation_kinds = {"lei", "decreto", "proposicao"}
          procurement_kinds = {"licitacao", "contrato", "ata"}
          documents = sum(int(counts.get(kind, 0)) for kind in document_kinds)
          legislation = sum(int(counts.get(kind, 0)) for kind in legislation_kinds)
          procurements = sum(int(counts.get(kind, 0)) for kind in procurement_kinds)
          procurement_api_records = db.execute(
              "SELECT COUNT(*) FROM records WHERE active=1 "
              "AND (id LIKE 'pncp:%' OR id LIKE 'comprasgov:%')"
          ).fetchone()[0]
          if documents < 1:
              raise SystemExit("refusing to publish a snapshot with zero documents")
          if legislation < 1:
              raise SystemExit("refusing to publish a snapshot with zero legislation")
          if procurements < 1:
              raise SystemExit("refusing to publish a snapshot with zero procurements")
          if procurement_api_records < 1:
              raise SystemExit("refusing to publish a snapshot without PNCP/Compras.gov records")

          extracted = db.execute(
              "SELECT COUNT(*) FROM records WHERE active=1 AND kind='arquivo' "
              "AND payload_json LIKE '%\"texto_extraido\":true%'"
          ).fetchone()[0]
          fts = db.execute("SELECT COUNT(*) FROM records_fts").fetchone()[0]
          if fts != total:
              raise SystemExit(f"FTS mismatch: {fts} != {total}")
          db.close()

          metadata = {
              "generated_at": datetime.now(UTC).isoformat(),
              "records": total,
              "documents": documents,
              "legislation": legislation,
              "procurements": procurements,
              "procurement_api_records": procurement_api_records,
              "documents_with_extracted_text": extracted,
              "fts_rows": fts,
              "counts_by_kind": counts,
              "schema": 5,
              "profile": "daily-full",
          }
          with open("data-latest.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, ensure_ascii=False, indent=2)
          print(json.dumps(metadata, ensure_ascii=False))
          PY

      - name: Compress and checksum snapshot
        shell: bash
        run: |
          gzip -9 -n -c suzano-aberta.sqlite3 > suzano-aberta.sqlite3.gz
          sha256sum suzano-aberta.sqlite3.gz > suzano-aberta.sqlite3.gz.sha256

      - name: Publish rolling public snapshot
        shell: bash
        run: |
          if gh release view data-latest >/dev/null 2>&1; then
            gh release upload data-latest \
              suzano-aberta.sqlite3.gz \
              suzano-aberta.sqlite3.gz.sha256 \
              data-latest.json \
              --clobber
          else
            gh release create data-latest \
              suzano-aberta.sqlite3.gz \
              suzano-aberta.sqlite3.gz.sha256 \
              data-latest.json \
              --title "Suzano Aberta — índice diário" \
              --notes "Snapshot público rolling, reconstruído automaticamente a partir de fontes públicas. Este asset é mutável e não representa uma release de código." \
              --prerelease
          fi
          gh workflow run pages.yml --ref main
