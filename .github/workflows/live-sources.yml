name: Live source smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: live-sources
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check live sources
        run: pytest -q tests_live

      - name: Close recovered source incident
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --search 'Autopilot live source health failure in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "As verificações de fontes externas voltaram a passar no run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Encerrando o incidente automaticamente."
            gh issue close "$issue" --reason completed
          fi

      - name: Record live source incident
        if: failure()
        shell: bash
        run: |
          set -u
          title="Autopilot live source health failure"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          body="Uma ou mais verificações de fontes públicas externas falharam. O portal continua servindo o último snapshot validado. Run: $run_url"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body" || true
          else
            gh issue create --title "$title" --body "$body" || true
          fi
