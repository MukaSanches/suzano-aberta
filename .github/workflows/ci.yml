name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Static correctness checks
        run: ruff check --select E,F --ignore E501 .
      - name: Type check
        run: mypy src/suzano_aberta
      - name: Tests + property-based invariants
        run: pytest --cov=suzano_aberta --cov-report=term-missing
      - name: CLI, API and library smoke tests
        run: |
          suzano --help
          suzano auto --help
          suzano data --help
          suzano data quality --help
          suzano data timeline --help
          suzano data at --help
          suzano data diff --help
          suzano data manifest --help
          suzano data verify --help
          suzano data lineage --help
          suzano data catalog --help
          suzano data archive --help
          suzano inicio --help
          suzano diagnostico --help
          suzano recentes --help
          suzano console --help
          suzano-api --help
          python -c "import suzano_aberta as s; assert s.__version__ == '1.0.0'; assert s.DataContract and s.ContentAddressedStore and s.LineageJournal and s.SuzanoIndex and s.SuzanoClient"
          python -c "from suzano_aberta.api import app; schema=app.openapi(); assert schema['info']['version'] == '1.2.0'; required={'/v1/autopilot','/v1/quality','/v1/manifest','/v1/diff','/v1/records/{record_id}/history','/v1/records/{record_id}/at','/v1/feed/changes.atom'}; assert required.issubset(schema['paths'])"

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -c "import importlib.metadata as m, suzano_aberta as s; assert s.__version__ == m.version('suzano-aberta') == '1.0.0'"
          python -c "from suzano_aberta import ContentAddressedStore, DataContract, LineageJournal, SuzanoClient, SuzanoIndex; assert ContentAddressedStore and DataContract and LineageJournal and SuzanoClient and SuzanoIndex"
          python -c "from suzano_aberta.api import app; schema=app.openapi(); required={'/v1/quality','/v1/manifest','/v1/diff','/v1/records/{record_id}/history','/v1/records/{record_id}/at'}; assert required.issubset(schema['paths'])"
          suzano --help
          suzano auto --help
          suzano data --help
          suzano-api --help

  container:
    name: Build API container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t suzano-aberta-api:ci .
      - name: Container CLI smoke test
        run: |
          docker run --rm suzano-aberta-api:ci suzano-api --help
          docker run --rm suzano-aberta-api:ci suzano auto --help
          docker run --rm suzano-aberta-api:ci suzano data --help
