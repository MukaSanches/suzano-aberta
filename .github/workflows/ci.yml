name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/suzano_aberta
      - name: Tests
        run: pytest --cov=suzano_aberta --cov-report=term-missing
      - name: CLI smoke test
        run: suzano --help

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import suzano_aberta; assert suzano_aberta.__version__ == '0.1.0'"
          suzano --help
