name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile
        run: python -m compileall -q src tests

      - name: Static correctness checks
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ruff check --select E,F --ignore E501 . 2>&1 | tee ruff.txt
          status=${PIPESTATUS[0]}
          echo "$status" > ruff.status
          exit "$status"

      - name: Tests
        run: pytest --cov=suzano_aberta --cov-report=term-missing

      - name: CLI smoke test
        run: |
          suzano --help
          suzano fontes --help
          suzano doctor --help

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-python-${{ matrix.python-version }}
          path: |
            ruff.txt
            ruff.status
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce static checks
        if: always()
        shell: bash
        run: |
          test -f ruff.status
          test "$(cat ruff.status)" = "0"

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -c "import suzano_aberta; assert suzano_aberta.__version__ == '0.1.0'"
          suzano --help
