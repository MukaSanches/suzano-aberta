name: Portal público

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "brand/**"
      - "src/suzano_aberta/sources/**"
      - "src/suzano_aberta/catalog.py"
      - "scripts/build_web_dataset.py"
      - "scripts/build_browser_legislation.py"
      - "scripts/build_portal_enrichment.py"
      - "scripts/enrich_official_links.py"
      - "scripts/build_news_feed.py"
      - "scripts/build_autopilot_digest.py"
      - "scripts/check_autopilot.py"
      - "scripts/render_web_config.py"
      - "scripts/check_web.py"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "brand/**"
      - "src/suzano_aberta/sources/**"
      - "src/suzano_aberta/catalog.py"
      - "scripts/build_web_dataset.py"
      - "scripts/build_browser_legislation.py"
      - "scripts/build_portal_enrichment.py"
      - "scripts/enrich_official_links.py"
      - "scripts/build_news_feed.py"
      - "scripts/build_autopilot_digest.py"
      - "scripts/check_autopilot.py"
      - "scripts/render_web_config.py"
      - "scripts/check_web.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install library
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Download validated rolling snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            -o /tmp/suzano-aberta.sqlite3.gz \
            https://github.com/MukaSanches/suzano-aberta/releases/download/data-latest/suzano-aberta.sqlite3.gz
          curl --fail --location --retry 3 --retry-delay 2 \
            -o /tmp/suzano-aberta.sqlite3.gz.sha256 \
            https://github.com/MukaSanches/suzano-aberta/releases/download/data-latest/suzano-aberta.sqlite3.gz.sha256
          python - <<'PY'
          import gzip, hashlib, pathlib, sqlite3
          compressed = pathlib.Path('/tmp/suzano-aberta.sqlite3.gz')
          checksum = pathlib.Path('/tmp/suzano-aberta.sqlite3.gz.sha256').read_text().split()[0]
          actual = hashlib.sha256(compressed.read_bytes()).hexdigest()
          if actual.casefold() != checksum.casefold():
              raise SystemExit('checksum do snapshot não confere')
          target = pathlib.Path('/tmp/suzano-aberta.sqlite3')
          target.write_bytes(gzip.decompress(compressed.read_bytes()))
          conn = sqlite3.connect(target)
          check = conn.execute('PRAGMA quick_check').fetchone()[0]
          total = conn.execute('SELECT COUNT(*) FROM records WHERE active=1').fetchone()[0]
          conn.close()
          if str(check).lower() != 'ok' or total < 1:
              raise SystemExit(f'snapshot inválido: check={check} records={total}')
          print(f'snapshot validado: {total} registros')
          PY

      - name: Build static search dataset
        run: python scripts/build_web_dataset.py --database /tmp/suzano-aberta.sqlite3 --output web/data

      - name: Build browser-native legislation feed
        run: python scripts/build_browser_legislation.py

      - name: Build cross-record relations and detail collections
        run: python scripts/build_portal_enrichment.py --database /tmp/suzano-aberta.sqlite3 --output web/data

      - name: Materialize canonical official links
        run: python scripts/enrich_official_links.py --root web

      - name: Refresh autonomous news desk
        run: python scripts/build_news_feed.py --database /tmp/suzano-aberta.sqlite3 --output web/data/news.json

      - name: Build autonomous city briefing
        run: python scripts/build_autopilot_digest.py --database /tmp/suzano-aberta.sqlite3 --news web/data/news.json --output web/data/autopilot.json

      - name: Render runtime configuration
        env:
          SUZANO_API_BASE: ${{ vars.SUZANO_API_BASE }}
        run: python scripts/render_web_config.py --api-base "$SUZANO_API_BASE"

      - name: Validate portal
        run: |
          python scripts/check_web.py
          python scripts/check_autopilot.py
          python -m compileall -q scripts src
          node --check web/assets/app.js
          node --check web/assets/portal-v2.js
          node --check web/assets/portal-v3.js
          node --check web/assets/portal-v4.js
          node --check web/assets/portal-v5.js
          node --check web/assets/portal-v6.js
          node --check web/assets/portal-v7.js
          node --check web/assets/legislation-v8.js
          node --check web/assets/search-worker.js
          node tests/search-worker.test.mjs
          node tests/search-dataset-smoke.mjs
          node --check web/sw.js
          python - <<'PY'
          import gzip, json, pathlib
          root = pathlib.Path("web/data")
          news = json.loads((root / "news.json").read_text(encoding="utf-8"))
          items = news.get("items") or []
          if int(news.get("count", 0)) < 5 or len(items) < 5:
              raise SystemExit("feed autônomo possui menos de 5 itens")
          if int(news.get("publisher_count", 0)) < 2:
              raise SystemExit("feed autônomo não possui diversidade mínima de fontes")
          autopilot = json.loads((root / "autopilot.json").read_text(encoding="utf-8"))
          pulse = autopilot.get("pulse") or {}
          enrichment = json.loads((root / "enrichment.json").read_text(encoding="utf-8"))
          if enrichment.get("detail_shards") != 16 or enrichment.get("relation_shards") != 16:
              raise SystemExit("camada de detalhes/relacionamentos incompleta")
          if int(enrichment.get("procurements_raw", 0)) <= 4:
              raise SystemExit("snapshot rolling não possui contratações estruturadas suficientes")
          if int(enrichment.get("procurement_sources", 0)) < 2:
              raise SystemExit("snapshot rolling não possui cobertura multi-fonte suficiente")
          with gzip.open("web/api/v1/contratacoes.json.gz", "rt", encoding="utf-8") as handle:
              payload = json.load(handle)
          procurement_items = payload.get("items") or []
          if not procurement_items:
              raise SystemExit("coleção pública de contratações está vazia")
          exact_links = [item for item in procurement_items if (item.get("attributes") or {}).get("official_url_quality") == "exact"]
          if not exact_links:
              raise SystemExit("nenhuma contratação possui link oficial direto materializado")

          legislation = json.loads((root / "legislation.json").read_text(encoding="utf-8"))
          legislation_items = legislation.get("items") or []
          legislation_meta = legislation.get("meta") or {}
          laws = [item for item in legislation_items if item.get("kind") == "lei"]
          if not laws or int((legislation_meta.get("counts_by_kind") or {}).get("lei", 0)) < 1:
              raise SystemExit("feed direto do navegador foi publicado sem leis")
          dates = [str(item.get("effective_date") or item.get("date") or "") for item in laws[:40]]
          if dates != sorted(dates, reverse=True):
              raise SystemExit("feed direto do navegador perdeu a ordenação cronológica das leis")
          print({
              "news": len(items),
              "publishers": news.get("publisher_count"),
              "autopilot_records": pulse.get("records"),
              "official_exact": len(exact_links),
              "browser_legislation": len(legislation_items),
              "browser_laws": len(laws),
              "latest_browser_law": laws[0].get("title"),
              "latest_browser_law_date": laws[0].get("effective_date") or laws[0].get("date"),
              **enrichment,
          })
          PY

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
