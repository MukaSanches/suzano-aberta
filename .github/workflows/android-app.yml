name: Android App

on:
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/android/**"
      - "scripts/sync_mobile_shell.py"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/android-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/android/**"
      - "scripts/sync_mobile_shell.py"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" mobile/android/app/build.gradle | head -n 1)"
          version_code="$(sed -n "s/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p" mobile/android/app/build.gradle | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$version_name" >> "$GITHUB_OUTPUT"

      - name: Validate web app
        run: |
          node --check web/app/app.js
          node --check web/app/sw.js
          node --test tests/mobile-app.test.mjs

      - name: Synchronize bundled offline shell
        run: python scripts/sync_mobile_shell.py --check-after-copy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.6.0"

      - name: Lint and build installable APK
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleDebug

      - name: Prepare public APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk suzano-aberta-android.apk
          sha256sum suzano-aberta-android.apk > suzano-aberta-android.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs suzano-aberta-android.apk > suzano-aberta-android-signature.txt

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suzano-aberta-android-${{ steps.version.outputs.name }}
          path: |
            suzano-aberta-android.apk
            suzano-aberta-android.sha256
            suzano-aberta-android-signature.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          cat > android-release-notes.md <<EOF
          ## Suzano Aberta para Android

          APK de instalação direta do aplicativo cívico independente Suzano Aberta.

          **Versão:** ${VERSION_NAME} (${VERSION_CODE})  
          **Compatibilidade mínima:** Android 8.0 / API 26  
          **Alvo:** Android 16 / API 36  
          **Commit:** ${GITHUB_SHA}

          ### Como instalar
          1. Baixe **suzano-aberta-android.apk** nesta página.
          2. Abra o arquivo no Android.
          3. Se o sistema solicitar, autorize temporariamente a instalação de aplicativos desta fonte.
          4. Confirme **Instalar** e abra o Suzano Aberta.

          O Android pode mostrar um aviso porque o APK é distribuído diretamente pelo GitHub e não pela Play Store. Não é necessário desativar o Play Protect.

          ### Verificação
          O release inclui **suzano-aberta-android.sha256** e **suzano-aberta-android-signature.txt** para conferência do arquivo publicado.

          O aplicativo é remote-first e usa a mesma infraestrutura pública do portal, com fallback local empacotado para falhas de rede.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$release_sha" = "$GITHUB_SHA" ]; then
              gh release upload "$RELEASE_TAG" \
                suzano-aberta-android.apk \
                suzano-aberta-android.sha256 \
                suzano-aberta-android-signature.txt \
                --clobber
              gh release edit "$RELEASE_TAG" \
                --title "Suzano Aberta Android ${VERSION_NAME}" \
                --notes-file android-release-notes.md \
                --latest
              exit 0
            fi

            echo "Android ${VERSION_NAME} já possui release em outro commit."
            echo "A publicação pública foi preservada. Incremente versionName/versionCode para um novo APK nativo."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            suzano-aberta-android.apk \
            suzano-aberta-android.sha256 \
            suzano-aberta-android-signature.txt \
            --target "$GITHUB_SHA" \
            --title "Suzano Aberta Android ${VERSION_NAME}" \
            --notes-file android-release-notes.md \
            --latest
