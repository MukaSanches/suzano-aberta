name: Android App

on:
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/android/**"
      - "scripts/sync_mobile_shell.py"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/android-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/android/**"
      - "scripts/sync_mobile_shell.py"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate web app
        run: |
          node --check web/app/app.js
          node --check web/app/sw.js
          node --test tests/mobile-app.test.mjs

      - name: Synchronize bundled offline shell
        run: python scripts/sync_mobile_shell.py --check-after-copy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable APK
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: suzano-aberta-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
