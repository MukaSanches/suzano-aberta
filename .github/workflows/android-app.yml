name: Android App

on:
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/android/**"
      - "scripts/sync_mobile_shell.py"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/android-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/android/**"
      - "scripts/sync_mobile_shell.py"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate web app
        run: |
          node --check web/app/app.js
          node --check web/app/sw.js
          node --test tests/mobile-app.test.mjs

      - name: Synchronize bundled offline shell
        run: python scripts/sync_mobile_shell.py --check-after-copy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.6.0"

      - name: Lint and build installable APK
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleDebug

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suzano-aberta-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
