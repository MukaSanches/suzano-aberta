name: iOS App

on:
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/ios/**"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/ios-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/app/**"
      - "mobile/ios/**"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shared mobile shell
        run: |
          node --check web/app/app.js
          node --check web/app/sw.js
          node --test tests/mobile-app.test.mjs

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project SuzanoAberta.xcodeproj \
            -scheme SuzanoAberta \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package simulator build
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/SuzanoAberta.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/suzano-aberta-ios-simulator.zip"

      - name: Upload simulator build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suzano-aberta-ios-simulator
          path: ${{ runner.temp }}/suzano-aberta-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30
