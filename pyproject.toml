[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "suzano-aberta"
version = "0.9.0"
description = "Infraestrutura cívica local-first para descoberta, preservação, busca, diagnóstico e reutilização de dados e documentos públicos relacionados a Suzano, SP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "MukaSanches"}]
keywords = ["suzano", "dados-abertos", "transparencia", "governo-aberto", "civic-tech", "legislativo", "busca", "fts5", "crawler", "arquivo", "documentos", "common-crawl", "internet-archive", "api", "openapi", "proveniencia", "dcat", "entidades", "qualidade-de-dados", "cli", "windows", "sqlite", "autopilot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "charset-normalizer>=3.3,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-beautifulsoup4>=4.12",
]

[project.scripts]
suzano = "suzano_aberta.entrypoint:app"
suzano-aberta = "suzano_aberta.entrypoint:app"
suzano-console = "suzano_aberta.console:main"
suzano-api = "suzano_aberta.api.__main__:main"

[project.urls]
Homepage = "https://mukasanches.github.io/suzano-aberta/"
Repository = "https://github.com/MukaSanches/suzano-aberta"
Documentation = "https://github.com/MukaSanches/suzano-aberta#readme"
Issues = "https://github.com/MukaSanches/suzano-aberta/issues"
Changelog = "https://github.com/MukaSanches/suzano-aberta/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/suzano_aberta"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
packages = ["suzano_aberta"]

[tool.coverage.run]
branch = true
source = ["suzano_aberta"]

[tool.coverage.report]
show_missing = true
skip_covered = true
